name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sourced from the pgvector service below. CI talks to a real Postgres from
  # the very first milestone: a suite that only ever runs against SQLite or
  # mocks will not catch the vector and full-text behaviour this project
  # depends on later.
  DEVPILOT_ENVIRONMENT: ci
  DEVPILOT_DATABASE_URL: postgresql+asyncpg://devpilot:devpilot@localhost:5432/devpilot_test
  # A throwaway signing secret for CI only. Settings validate at import, so the
  # migrate and test steps cannot construct the app without one. Never a real
  # secret: production reads its own from the deployment environment.
  DEVPILOT_JWT_SECRET: ci-only-signing-secret-at-least-32-characters

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devpilot
          POSTGRES_PASSWORD: devpilot
          POSTGRES_DB: devpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpilot -d devpilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: python -m ruff check src tests

      - name: Format check
        working-directory: backend
        run: python -m ruff format --check src tests

      - name: Type check
        working-directory: backend
        run: python -m mypy

      # Migrations run before the tests, and their success is itself a check.
      # Without this step a migration that does not apply would ship with a
      # green build, and the integration suite would skip rather than fail.
      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify migrations are reversible
        working-directory: backend
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Test
        working-directory: backend
        run: python -m pytest --cov=devpilot --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # A green test suite and a broken image is a failure mode worth
      # spending two minutes a build to rule out.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          load: true
          tags: devpilot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm \
            -e DEVPILOT_DATABASE_URL=postgresql+asyncpg://u:p@db:5432/devpilot \
            -e DEVPILOT_JWT_SECRET=ci-only-signing-secret-at-least-32-characters \
            devpilot-api:ci \
            python -c "from devpilot.main import create_app; create_app(); print('image ok')"

      # The runtime/dev split is only real if something enforces it. Without
      # this, adding pytest to the production image would pass every other
      # check in this workflow.
      - name: Assert the runtime image carries no test dependencies
        run: |
          if docker run --rm devpilot-api:ci python -c "import pytest" 2>/dev/null; then
            echo "::error::pytest is present in the runtime image; it belongs in the dev stage"
            exit 1
          fi
          if docker run --rm devpilot-api:ci sh -c "test -e /app/tests" 2>/dev/null; then
            echo "::error::test code is present in the runtime image"
            exit 1
          fi
          echo "runtime image is free of test dependencies and test code"

      # Build the dev target too, so a Dockerfile change that breaks the
      # developer test image is caught here rather than on someone's laptop.
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: dev
          push: false
          load: true
          tags: devpilot-api:dev
          cache-from: type=gha

      - name: Assert pytest is runnable in the dev image
        run: docker run --rm devpilot-api:dev pytest --collect-only -q -m "not integration" | tail -3
