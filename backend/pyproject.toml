[project]
name = "devpilot"
version = "0.1.0"
description = "AI-powered software engineering assistant that understands GitHub repositories."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "structlog>=24.4.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.10.0",
    "uuid6>=2025.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "src" makes the package importable without an install step. "." makes the
# `tests` package importable, which `from tests.conftest import ...` needs.
# Without ".", the suite passes under `python -m pytest` (which injects the
# working directory into sys.path) and fails under bare `pytest` (which does
# not) -- so it would work on a developer laptop and break inside the
# container. Pinning both here makes the two invocations equivalent.
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL with pgvector (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ANN", "D", "RUF"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"alembic/*" = ["D", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
